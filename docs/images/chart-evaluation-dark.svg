<svg xmlns="http://www.w3.org/2000/svg" width="760" height="506" viewBox="0 0 760 506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-label="PhishHawk 2.0 against 1.2.0 on real mail">
