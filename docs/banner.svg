>U=</text><text xml:space="preserve" x="189.89" y="262.06" fill="#ff8700">UVUV.</text><text xml:space="preserve" x="322.71" y="262.06" fill="#ff8700">88ooo88 88ooo88 88   I8I   88 88,8P</text><text xml:space="preserve" x="57.06" y="280.52" fill="#ff8700">XUXUXUXUXUUVUVUVUVUV.</text><text xml:space="preserve" x="322.71" y="280.52" fill="#ff8700">88~~~88 88~~~88 Y8   I8I   88 88`8b</text><text xml:space="preserve" x="57.06" y="298.98" fill="#ff8700">UXUXUXUXVUVUVUVUVUV-</text><text xml:space="preserve" x="322.71" y="298.98" fill="#ff8700">88   88 88   88 `8b d8'8b d8' 88 `88.</text><text xml:space="preserve" x="57.06" y="317.44" fill="#ff8700">XUXUXUUVUVUVUVUVUVU</text><text xml:space="preserve" x="322.71" y="317.44" fill="#ff8700">YP   YP YP   YP  `8b8' `8d8'  YP   YD</text><text xml:space="preserve" x="57.06" y="335.90" fill="#ff8700">UXUUVUVUVUVUVUVUV</text><text xml:space="preserve" x="189.89" y="335.90" fill="#ff5f00">UV</text><text xml:space="preserve" x="57.06" y="354.36" fill="#ff8700">XVUVUVUVUVUVUV</text><text xml:space="preserve" x="166.45" y="354.36" fill="#ff5f00">UVUVU</text><text xml:space="preserve" x="322.71" y="354.36" fill="#bcbcbc">sharp-eyed phishing triage for the SOC</text><text xml:space="preserve" x="57.06" y="372.82" fill="#ff8700">:------------</text><text xml:space="preserve" x="158.63" y="372.82" fill="#ff5f00">------</text><text xml:space="preserve" x="322.71" y="372.82" fill="#d5dbe5" opacity=".62">v1.0.0  ·  MIT  ·  phishhawk -h for help</text><text xml:space="preserve" x="18.00" y="409.74" fill="#d5dbe5">usage: phishhawk [-h] [-V] &lt;command&gt; ...</text><text xml:space="preserve" x="18.00" y="446.66" fill="#d5dbe5">PhishHawk extracts every indicator from a reported phishing email, checks the</text><text xml:space="preserve" x="18.00" y="465.12" fill="#d5dbe5">ones that matter against VirusTotal, urlscan.io, RDAP and AbuseIPDB, maps what</text><text xml:space="preserve" x="18.00" y="483.58" fill="#d5dbe5">it finds to MITRE ATT&amp;CK, and tells you what to do next.</text><text xml:space="preserve" x="18.00" y="520.50" fill="#d5dbe5">options:</text><text xml:space="preserve" x="33.63" y="538.96" fill="#d5dbe5">-h, --help     show this help message and exit</text><text xml:space="preserve" x="33.63" y="557.42" fill="#d5dbe5">-V, --version  show program's version number and exit</text><text xml:space="preserve" x="18.00" y="594.34" fill="#d5dbe5">commands:</text><text xml:space="preserve" x="33.63" y="612.80" fill="#d5dbe5">&lt;command&gt;</text><text xml:space="preserve" x="49.25" y="631.26" fill="#d5dbe5">scan         triage .eml files, folders or stdin (the default command)</text><text xml:space="preserve" x="49.25" y="649.72" fill="#d5dbe5">doctor       check dependencies, API keys, cache and network</text><text xml:space="preserve" x="49.25" y="668.18" fill="#d5dbe5">cache        show or clear the lookup cache</text><text xml:space="preserve" x="49.25" y="686.64" fill="#d5dbe5">techniques   list the MITRE ATT&amp;CK techniques PhishHawk can evidence</text><text xml:space="preserve" x="49.25" y="705.10" fill="#d5dbe5">help         show help for a command</text><text xml:space="preserve" x="18.00" y="742.02" fill="#d5dbe5">quick start:</text><text xml:space="preserve" x="33.63" y="760.48" fill="#d5dbe5">phishhawk suspicious.eml            triage one message (same as: phishhawk scan ...)</text><text xml:space="preserve" x="33.63" y="778.94" fill="#d5dbe5">phishhawk scan reported/ --quiet    every .eml in a folder, one summary each</text><text xml:space="preserve" x="33.63" y="797.40" fill="#d5dbe5">phishhawk doctor                    check keys and setup before the first real run</text><text xml:space="preserve" x="18.00" y="834.32" fill="#d5dbe5">Run `phishhawk &lt;command&gt; -h` for everything a command can do.</text></svg>