# PhishHawk web app. Before the first start, create the two keys (docs/SERVER.md):
#   mkdir -m 700 secrets
#   openssl rand -base64 32 > secrets/phishhawk_secret_key
#   openssl rand -base64 32 > secrets/phishhawk_encryption_key
#   chmod 644 secrets/*    # the container's user reads them; the folder keeps others out
# Then: docker compose up -d
#       docker compose exec phishhawk phishhawk server create-admin admin
# Keep a copy of the encryption key: without it no backup can be read.
services:
  phishhawk:
    build:
      context: .
      dockerfile: server.Dockerfile
    image: phishhawk-server
    ports:
      - "127.0.0.1:8000:8000"  # this machine only; put a TLS reverse proxy in front for anything else
    environment:
      # false only to test over plain HTTP with a client other than a browser (CI does)
      PHISHHAWK_COOKIE_SECURE: ${PHISHHAWK_COOKIE_SECURE:-true}
      # a reverse proxy on this machine or on a Docker network reaches the container from these addresses
      PHISHHAWK_TRUSTED_PROXIES: ${PHISHHAWK_TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12}
      # the image serves the frontend in frontend/ at /app/; to serve another build, mount it below and use
      # PHISHHAWK_FRONTEND_DIR: /frontend
      # mail, for confirming addresses and resetting passwords (docs/SERVER.md, "Email and password reset"),
      # with the SMTP password in secrets/phishhawk_smtp_password and its two lines below uncommented:
      # PHISHHAWK_PUBLIC_URL: https://phishhawk.example.org
      # PHISHHAWK_SMTP_HOST: smtp-relay.brevo.com
      # PHISHHAWK_SMTP_USERNAME: the SMTP login your provider shows
      # PHISHHAWK_SMTP_FROM: PhishHawk <no-reply@example.org>
    volumes:
      - phishhawk-data:/data
      # - ./frontend-dist:/frontend:ro
    secrets:
      - phishhawk_secret_key
      - phishhawk_encryption_key
      # - phishhawk_smtp_password
    init: true  # reaps the worker's helper processes
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  phishhawk_secret_key:
    file: ./secrets/phishhawk_secret_key
  phishhawk_encryption_key:
    file: ./secrets/phishhawk_encryption_key
  # phishhawk_smtp_password:
  #   file: ./secrets/phishhawk_smtp_password

volumes:
  phishhawk-data:
