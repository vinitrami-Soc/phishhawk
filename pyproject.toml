[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishhawk"
dynamic = ["version"]
description = "PhishHawk: sharp-eyed phishing IOC extraction, enrichment and triage for SOC analysts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinit Rami" }]
keywords = ["phishing", "soc", "dfir", "threat-intelligence", "ioc", "stix", "mitre-attack", "virustotal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "stix2>=3.0"]
# only for regenerating docs/ images and the banner art (docs/make_logo.py, docs/make_demo.py)
assets = ["cairosvg>=2.7", "pyfiglet>=1.0", "Pillow>=10.0"]

[project.scripts]
phishhawk = "phishhawk.cli:run"

[project.urls]
Homepage = "https://github.com/vinitrami-Soc/vinitrami-Soc.github.io/tree/main/phishhawk"

[tool.setuptools.dynamic]
version = { attr = "phishhawk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# %-formatting is used deliberately for defanged output templates.
ignore = ["UP031", "UP032", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["phishhawk"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# generated by docs/make_logo.py: one list of colour codes per row of the emblem
"src/phishhawk/_logo_art.py" = ["E501"]
