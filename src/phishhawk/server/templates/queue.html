{% extends "base.html" %}
{% block title %}Queue · PhishHawk{% endblock %}
{% block main %}
<h1>Queue</h1>
<form method="get" action="/queue" class="filters">
  <label for="q">Search SHA-256, report ID or indicator</label>
  <input id="q" name="q" value="{{ f.q }}">
  <label for="verdict">Verdict</label>
  <select id="verdict" name="verdict">
    <option value="">Any</option>
    {% for v in verdicts %}<option value="{{ v }}"{% if v == f.verdict %} selected{% endif %}>{{ v }}</option>{% endfor %}
  </select>
  <label for="source">Source</label>
  <select id="source" name="source">
    <option value="">Any</option>
    {% for s in sources %}<option value="{{ s }}"{% if s == f.source %} selected{% endif %}>{{ s }}</option>{% endfor %}
  </select>
  <label for="user">Submitted by</label>
  <select id="user" name="user">
    <option value="">Anyone</option>
    {% for id, name in users|dictsort(by='value') %}<option value="{{ id }}"{% if id|string == f.user %} selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  <label for="since">From (UTC)</label>
  <input id="since" name="since" type="date" value="{{ f.since }}">
  <label for="until">To (UTC)</label>
  <input id="until" name="until" type="date" value="{{ f.until }}">
  <button type="submit">Filter</button>
</form>
{% include "_table.html" %}
<nav class="pager" aria-label="Pages">
  {% if offset > 0 %}<a href="/queue?{{ query }}{% if query %}&amp;{% endif %}offset={{ [offset - page, 0]|max }}">Newer</a>{% endif %}
  {% if rows|length == page %}<a href="/queue?{{ query }}{% if query %}&amp;{% endif %}offset={{ offset + page }}">Older</a>{% endif %}
</nav>
{% endblock %}
