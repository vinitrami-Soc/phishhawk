{# the profile, seen only inside the workspace #}
<label for="first_name">First name</label>
<input id="first_name" name="first_name" value="{{ f.first_name or '' }}" autocomplete="given-name" maxlength="80" required>
<label for="last_name">Last name</label>
<input id="last_name" name="last_name" value="{{ f.last_name or '' }}" autocomplete="family-name" maxlength="80" required>
<label for="location">Location</label>
<input id="location" name="location" value="{{ f.location or '' }}" autocomplete="address-level2" maxlength="80" required>
<label for="job_title">Job title (optional)</label>
<input id="job_title" name="job_title" value="{{ f.job_title or '' }}" autocomplete="organization-title" maxlength="80">
