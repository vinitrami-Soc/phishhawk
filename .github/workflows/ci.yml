name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests samples eval tools phishhawk
      - name: Type check
        run: mypy
      - name: Optional YARA support (skipped by the tests if it will not install)
        run: python -m pip install yara-python || echo "yara-python unavailable; YARA tests will skip"
      - name: Unit tests, evaluation gate and coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Smoke-test every command
        # Exit code 1 means "suspicious": expected, since most samples are phishing.
        run: |
          phishhawk scan samples/ --offline --quiet --no-color \
            --stix bundle.json --html report.html --csv iocs.csv || test $? -eq 1
          python -c "import json; assert json.load(open('bundle.json'))['type'] == 'bundle'"
          phishhawk doctor --no-color
          phishhawk techniques --json > /dev/null
          phishhawk cache stats --no-color
          phishhawk campaign samples/ --no-color --json campaigns.json
          python -c "import json; assert json.load(open('campaigns.json'))['messages'] == 5"
          phishhawk scan samples/sample_phish.eml --offline --quiet --no-color \
            --evidence evidence --sandbox packs || test $? -eq 1
          phishhawk evidence verify evidence --no-color
          unzip -P infected -t packs/*.zip
          ./phishhawk --version
      - name: Evaluation report (synthetic corpus)
        run: python eval/run_eval.py --synthetic

  supply-chain:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # every commit is searched for secrets, not just the last
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in everything PhishHawk installs (pip-audit)
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install ".[qr]"
          "$RUNNER_TEMP/runtime/bin/pip" freeze --exclude-editable | grep -v '^phishhawk' > "$RUNNER_TEMP/runtime.txt"
          cat "$RUNNER_TEMP/runtime.txt"
          python -m pip install pip-audit
          pip-audit --requirement "$RUNNER_TEMP/runtime.txt" --no-deps --disable-pip --strict
      - name: Secrets in the code and its history (gitleaks)
        env:
          VERSION: 8.18.4
          SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --verbose

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install.sh into a scratch prefix, run it, uninstall it
        env:
          PHISHHAWK_HOME: ${{ runner.temp }}/phishhawk-home
          PHISHHAWK_BIN: ${{ runner.temp }}/phishhawk-bin
        run: |
          ./install.sh
          "$PHISHHAWK_BIN/phishhawk" scan samples/sample_benign.eml --offline --quiet
          # A non-editable install must still carry the report's fonts (package data).
          "$PHISHHAWK_BIN/phishhawk" scan samples/sample_phish.eml --offline --quiet \
            --html "$RUNNER_TEMP/report.html" || test $? -eq 1
          test "$(grep -o 'data:font/woff2' "$RUNNER_TEMP/report.html" | wc -l)" -eq 2
          ./install.sh --uninstall
          test ! -e "$PHISHHAWK_BIN/phishhawk"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t phishhawk .
      - name: Run offline in the container, as non-root, with no network
        run: |
          docker run --rm --network none -v "$PWD/samples:/mail:ro" phishhawk \
            scan sample_phish.eml --offline --quiet --no-color || test $? -eq 1
