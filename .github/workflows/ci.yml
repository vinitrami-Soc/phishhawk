name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests samples eval tools phishhawk
      - name: Type check
        run: mypy
      - name: Optional YARA support (skipped by the tests if it will not install)
        run: python -m pip install yara-python || echo "yara-python unavailable; YARA tests will skip"
      - name: Unit tests, evaluation gate and coverage
        # the web app's tests skip without its extra; the server job covers them
        run: |
          coverage run -m pytest
          coverage report --omit='*/phishhawk/server/*'
      - name: Smoke-test every command
        # Exit code 1 means "suspicious": expected, since most samples are phishing.
        run: |
          phishhawk scan samples/ --offline --quiet --no-color \
            --stix bundle.json --html report.html --csv iocs.csv || test $? -eq 1
          python -c "import json; assert json.load(open('bundle.json'))['type'] == 'bundle'"
          phishhawk doctor --no-color
          phishhawk techniques --json > /dev/null
          phishhawk cache stats --no-color
          phishhawk campaign samples/ --no-color --json campaigns.json
          python -c "import json; assert json.load(open('campaigns.json'))['messages'] == 5"
          phishhawk scan samples/sample_phish.eml --offline --quiet --no-color \
            --evidence evidence --sandbox packs || test $? -eq 1
          phishhawk evidence verify evidence --no-color
          unzip -P infected -t packs/*.zip
          ./phishhawk --version
      - name: Evaluation report (synthetic corpus)
        run: python eval/run_eval.py --synthetic

  supply-chain:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every commit is searched for secrets, not just the last
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in everything PhishHawk installs (pip-audit)
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install ".[qr,server,postgres]"
          "$RUNNER_TEMP/runtime/bin/pip" freeze --exclude-editable | grep -v '^phishhawk' > "$RUNNER_TEMP/runtime.txt"
          cat "$RUNNER_TEMP/runtime.txt"
          python -m pip install pip-audit
          pip-audit --requirement "$RUNNER_TEMP/runtime.txt" --no-deps --disable-pip --strict
      - name: Secrets in the code and its history (gitleaks)
        env:
          VERSION: 8.18.4
          SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --verbose

  server:
    name: web app (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the web app's dependencies
        run: python -m pip install -e ".[dev,server]"
      - name: A browser for the browser test (one Python is enough)
        if: matrix.python == '3.12'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Type check
        run: mypy
      - name: Every test, the web app's included, and coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: "Milestone M2: 500 messages as one batch, the UI answering, campaigns as the CLI's"
        if: matrix.python == '3.12'
        env:
          PHISHHAWK_M2_CHECK: "1"
        run: |
          set -o pipefail
          python -m pytest -s tests/server/test_milestone.py 2>&1 | tee milestone.log
          grep -q "1 passed" milestone.log

  server-postgres:
    name: web app on Postgres, with several workers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phishhawk
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway database on the runner, reachable from it alone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishhawk" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the web app's dependencies and the Postgres driver
        run: python -m pip install -e ".[dev,server,postgres]"
      - name: The web app's tests, each on a database of its own
        env:
          PHISHHAWK_TEST_DATABASE_URL: postgresql://phishhawk@localhost:5432/phishhawk
        run: python -m pytest tests/server

  server-docker:
    name: web app in Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Keys, made the way docs/SERVER.md says
        run: |
          mkdir -m 700 secrets
          openssl rand -base64 32 > secrets/phishhawk_secret_key
          openssl rand -base64 32 > secrets/phishhawk_encryption_key
          chmod 644 secrets/*
      - name: Build and start, then wait for the health check
        env:
          PHISHHAWK_COOKIE_SECURE: "false"  # the check below talks plain HTTP to 127.0.0.1
        run: docker compose up -d --build --wait
      - name: Log in, submit a sample, fetch every file, verify the audit log
        run: |
          SMOKE_PASSWORD="smoke-$(openssl rand -hex 12)"
          export SMOKE_PASSWORD
          printf '%s\n' "$SMOKE_PASSWORD" |
            docker compose exec -T phishhawk phishhawk server create-admin smoke --password-stdin
          python -m pip install requests
          python tools/server_smoke.py http://127.0.0.1:8000 --user smoke
          docker compose exec -T phishhawk phishhawk server audit verify
      - name: The frontend is built in and opens at the server's address
        run: |
          curl -fsS http://127.0.0.1:8000/app/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/)" = "http://127.0.0.1:8000/app/"
      - name: Stop cleanly
        run: |
          docker compose stop
          test "$(docker inspect "$(docker compose ps -aq phishhawk)" --format '{{.State.ExitCode}}')" -eq 0
      - name: Logs
        if: failure()
        run: docker compose logs

  server-deploy:
    name: web app as deployed (deploy/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up the way docs/DEPLOY.md says, without a tunnel token or mail
        run: printf 'https://phishhawk.example.org\n\n\n\n\n\n\n' | sh deploy/setup.sh
      - name: Build and start the web app on Postgres
        run: docker compose -f deploy/compose.yaml up -d --build --wait phishhawk db
      - name: From the tunnel's network, the login throttle slows down each visitor, not the tunnel
        run: |
          docker run --rm --network phishhawk_default --entrypoint python phishhawk-server -c '
          import json, urllib.request, urllib.error
          def attempt(address, username):  # a wrong password from that visitor, as the tunnel passes it on
              request = urllib.request.Request("http://phishhawk:8000/api/v1/session",
                  data=json.dumps({"username": username, "password": "wrong"}).encode(),
                  headers={"Content-Type": "application/json", "X-Forwarded-For": address, "X-Forwarded-Proto": "https"})
              try:
                  urllib.request.urlopen(request)
              except urllib.error.HTTPError as error:
                  return error.code
          codes = [attempt("203.0.113.7", "someone%d" % n) for n in range(3)]
          codes += [attempt("203.0.113.7", "someone-else"), attempt("198.51.100.9", "someone-new")]
          print(codes)
          assert codes == [401, 401, 401, 429, 401], codes'
      - name: Back up, change something, restore the way docs/DEPLOY.md says, and find it as it was
        run: |
          C="docker compose -f deploy/compose.yaml"
          openssl rand -hex 16 | $C exec -T phishhawk phishhawk server create-admin first --password-stdin
          sh deploy/backup.sh
          openssl rand -hex 16 | $C exec -T phishhawk phishhawk server create-admin second --password-stdin
          $C stop phishhawk
          $C exec -T db pg_restore -U phishhawk -d phishhawk --clean --if-exists < deploy/backups/db-*.dump
          $C run --rm -T --no-deps --entrypoint tar phishhawk -C /data -xzf - < deploy/backups/data-*.tgz
          $C up -d --wait phishhawk db
          test "$($C exec -T db psql -U phishhawk -d phishhawk -tAc 'select string_agg(username, $$,$$) from users')" = first
          $C exec -T phishhawk phishhawk server audit verify
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The build brief's rules, the locked files and the unit tests
        run: npm test
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: The server and a browser
        working-directory: .
        run: |
          python -m pip install -e ".[dev,server]" playwright
          python -m playwright install --with-deps chromium
      - name: The built frontend on a real server, in a real browser, at seven widths
        working-directory: .
        env:
          PHISHHAWK_FRONTEND_BUILD: frontend/dist
        run: |
          set -o pipefail
          python -m pytest tests/server/test_frontend_browser.py -p no:cacheprovider -rs | tee "$RUNNER_TEMP/frontend.txt"
          grep -qE "^[0-9]+ passed in " "$RUNNER_TEMP/frontend.txt"  # every test passed: a skipped one is not a pass

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install.sh into a scratch prefix, run it, uninstall it
        env:
          PHISHHAWK_HOME: ${{ runner.temp }}/phishhawk-home
          PHISHHAWK_BIN: ${{ runner.temp }}/phishhawk-bin
        run: |
          ./install.sh
          "$PHISHHAWK_BIN/phishhawk" scan samples/sample_benign.eml --offline --quiet
          # A non-editable install must still carry the report's fonts (package data).
          "$PHISHHAWK_BIN/phishhawk" scan samples/sample_phish.eml --offline --quiet \
            --html "$RUNNER_TEMP/report.html" || test $? -eq 1
          test "$(grep -o 'data:font/woff2' "$RUNNER_TEMP/report.html" | wc -l)" -eq 2
          ./install.sh --uninstall
          test ! -e "$PHISHHAWK_BIN/phishhawk"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t phishhawk .
      - name: Run offline in the container, as non-root, with no network
        run: |
          docker run --rm --network none -v "$PWD/samples:/mail:ro" phishhawk \
            scan sample_phish.eml --offline --quiet --no-color || test $? -eq 1
