version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # the web console in frontend/: its packages, in one pull request a month
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
  # deploy/compose.yaml: the tunnel's image (Postgres stays on 16: a new major needs a dump and restore)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
