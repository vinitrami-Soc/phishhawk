name: Bug report
description: A crash, a wrong report, an install problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full error output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Paste the output of `phishhawk doctor --no-color`, and say how you installed it (install.sh, pipx, pip, Docker)."
      render: text
    validations:
      required: true
